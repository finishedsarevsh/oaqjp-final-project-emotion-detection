<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Emotion Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 { color: #333; }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 16px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 10px;
            padding: 10px 25px;
            background-color: #0062ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #0047b3; }
        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 15px;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter text below and click <strong>Run Sentiment Analysis</strong> to detect emotions.</p>
    <textarea id="textToAnalyze" placeholder="Type your text here..."></textarea>
    <br/>
    <button onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
    <div id="output">Results will appear here.</div>
    <script src="/static/mywebscript.js"></script>
</body>
</html>
